
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIVINO DESIGNER | Expresse a Glória de Deus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .gold-text {
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        .gold-border {
            border-image: linear-gradient(to right, #BF953F, #FCF6BA, #B38728) 1;
        }
        .gold-button {
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728);
            transition: all 0.3s ease;
        }
        .gold-button:hover {
            box-shadow: 0 0 20px rgba(191, 149, 63, 0.6);
            transform: translateY(-2px);
        }
        .celestial-glow {
            box-shadow: 0 0 40px rgba(191, 149, 63, 0.15);
        }
        .bg-night {
            background: radial-gradient(circle at top center, #1e293b 0%, #020617 100%);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #BF953F;
            border-radius: 4px;
        }
    </style>
<script type="importmap">

}
</script>
</head>

</body>
</html>
